[package]
name = "bitnet-training"
version = "1.0.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Training and fine-tuning utilities for BitNet models"
keywords = ["bitnet", "training", "fine-tuning", "machine-learning"]
categories = ["science"]

[features]
default = ["std", "distributed", "peft"]
std = []
# Enable quantization-aware training
qat = ["bitnet-quant/qat"]
# Enable distributed training
distributed = []
# Enable parameter-efficient fine-tuning
peft = []
# Enable dataset utilities
datasets = ["dep:arrow"]
# Enable Metal acceleration for training (temporarily disabled due to dependency issues)
# metal = ["dep:bitnet-metal"]
# Enable MLX acceleration for training
mlx = ["dep:mlx-rs"]
# Enable MLX-accelerated training with QAT
mlx-training = ["mlx", "qat"]
# Enable Apple Silicon optimizations for training
apple-silicon = ["mlx", "peft"]

[dependencies]
bitnet-core = { path = "../bitnet-core", version = "1.0.0" }
bitnet-quant = { path = "../bitnet-quant", version = "1.0.0" }
# bitnet-inference = { path = "../bitnet-inference", version = "^1.0" }
# bitnet-metal = { path = "../bitnet-metal", version = "^1.0", optional = true }

# Core dependencies
candle-core.workspace = true
candle-nn = "0.8"
serde.workspace = true
serde_json = "1.0"
serde_yaml = "0.9"
anyhow.workspace = true
thiserror.workspace = true
half = "2.3"

# Training utilities
rand = { version = "0.8" }
tokio = { workspace = true, features = ["full"] }

# MLX dependencies (for Apple Silicon acceleration)
mlx-rs = { version = "0.25", optional = true }

# Dataset and tokenization
arrow = { version = "53.0", optional = true }

# Additional training utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
clap = { version = "4.0", features = ["derive"] }
env_logger = "0.10"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[[bin]]
name = "training_demo"
path = "src/bin/training_demo.rs"

[[bin]]
name = "mlx_trainer"
path = "src/bin/mlx_trainer.rs"

[[bin]]
name = "train_custom_bitnet"
path = "src/bin/train_custom_bitnet.rs"

[[bin]]
name = "export_to_gguf"
path = "src/bin/export_to_gguf.rs"

[[bin]]
name = "generate_synthetic_data"
path = "src/bin/generate_synthetic_data.rs"

[[bin]]
name = "validate_dataset"
path = "src/bin/validate_dataset.rs"

[[bin]]
name = "training_stats"
path = "src/bin/training_stats.rs"

[[bin]]
name = "optimize_gguf"
path = "src/bin/optimize_gguf.rs"

[[bin]]
name = "validate_gguf"
path = "src/bin/validate_gguf.rs"

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3.0"
tokio-test = "0.4"
